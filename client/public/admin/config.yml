backend:
  name: git-gateway
  branch: main

media_folder: "public/images/properties"
public_folder: "/images/properties"

locale: cs

site_url: https://rpluspreal.netlify.app
display_url: https://rpluspreal.netlify.app

collections:
  - name: "nemovitosti"
    label: "Nemovitosti"
    label_singular: "Nemovitost"
    folder: "src/content/nemovitosti"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Název", name: "title", widget: "string", hint: "Např. Rodinný dům 4+1 s garáží" }
      - { label: "Lokalita", name: "location", widget: "string", hint: "Např. Frýdek-Místek – Místek" }
      - { label: "Cena", name: "price", widget: "string", hint: "Např. 4 500 000 Kč nebo 15 000 Kč/měs." }
      - label: "Typ"
        name: "type"
        widget: "select"
        options:
          - { label: "Rodinný dům", value: "Domy" }
          - { label: "Byt", value: "Byty" }
          - { label: "Komerční prostor", value: "Komerční" }
          - { label: "Pozemek", value: "Pozemky" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Prodej", value: "Prodej" }
          - { label: "Pronájem", value: "Pronájem" }
          - { label: "Prodáno", value: "Prodáno" }
      - { label: "Plocha (m²)", name: "area", widget: "number", value_type: "int", hint: "Celková plocha v m²" }
      - { label: "Počet pokojů", name: "rooms", widget: "number", value_type: "int", required: false }
      - { label: "Popis", name: "description", widget: "text", hint: "Krátký popis nemovitosti" }
      - { label: "Fotografie", name: "image", widget: "image", required: false, hint: "Hlavní fotografie nemovitosti" }
      - label: "Štítek (badge)"
        name: "badge"
        widget: "select"
        required: false
        options:
          - { label: "Žádný", value: "" }
          - { label: "Nová nabídka", value: "Nová nabídka" }
          - { label: "Exkluzivní", value: "Exkluzivní" }
          - { label: "Volné ihned", value: "Volné ihned" }
          - { label: "Investiční příležitost", value: "Investiční příležitost" }
          - { label: "Snížená cena", value: "Snížená cena" }
      - label: "Makléř"
        name: "agent"
        widget: "select"
        options:
          - { label: "Ing. Vít Hovjadský", value: "Ing. Vít Hovjadský" }
          - { label: "Ing. Petra Koudelková", value: "Ing. Petra Koudelková" }
      - { label: "Pořadí zobrazení", name: "order", widget: "number", value_type: "int", default: 99, required: false }
